<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirme seu e-mail na OnneGram</title>
  </head>
  <body style="margin:0;padding:32px 16px;background:#f3f3f0;color:#171815;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;max-width:520px;margin:0 auto;border-collapse:collapse;">
      <tr>
        <td style="padding:22px 28px;background:#101010;color:#f5f5f3;border-radius:12px 12px 0 0;font-size:22px;font-weight:bold;letter-spacing:-1px;">
          onne<span style="font-weight:normal;">gram</span>
        </td>
      </tr>
      <tr>
        <td style="padding:32px 28px;background:#ffffff;border-radius:0 0 12px 12px;">
          <h1 style="margin:0 0 16px;font-size:24px;line-height:1.3;">Confirme seu e-mail</h1>
          <p style="margin:0 0 22px;color:#555;font-size:15px;line-height:1.6;">Digite este código na tela de cadastro para ativar sua conta OnneGram:</p>
          <p style="margin:0 0 22px;padding:16px;background:#f3f5ed;border-radius:8px;text-align:center;color:#171815;font-size:30px;font-weight:bold;letter-spacing:6px;">{{ .Token }}</p>
          <p style="margin:0;color:#666;font-size:13px;line-height:1.6;">Se você não criou uma conta, pode ignorar este e-mail.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
